# Cold-start training arm: identical to dqn_full.yaml / dqn_nov2v.yaml except that each
# 20-frame episode replays a fragment of a SUMO run started on an empty network.
# Descriptive record of the executed configuration. The code does not read this
# file: the values are set by scripts/slurm/train_coldtrain.sh and coldtrain_fragments.sh,
# config.py and refactor/src/training_config/. Those files are authoritative.
# Checkpoints: checkpoints/berlin_coldtrain_{v2v,local}_seed{100..104}/model.zip
# Results: results/eval_coldtrain_{paired_warm,paired_cold,main}_<period>.csv
# Whole arm on SLURM: scripts/slurm/launch_coldtrain_arm.sh

arm: berlin_coldtrain
variants: [v2v, local]                 # local = --no-v2v, V2V range 0 m
command: bash scripts/slurm/train_coldtrain.sh <v2v|local> <seed>

fragments:                             # scripts/slurm/coldtrain_fragments.sh -> data/coldtrain/
  command: python scripts/make_paired_fragments.py coldtrain --cfg sumo/berlin_a100_16-18.sumocfg --out data/coldtrain --n 2000 --frames 20 --horizon 120 --seed 4242
  start_times: 2000 drawn uniformly from [0, 85800) s with seed 4242 (starts_all_seed4242.json)
  sumo_seed: 42 + start time
  frames_per_fragment: 20              # first 20 non-empty frames after a cold start at the start time
  horizon_s: [120, 600, 1800]          # extended for night starts; start times with no vehicle within 1800 s are skipped
  density_by_frame: results/coldtrain_density/coldtrain_density_frames.csv
training_seeds: [100, 101, 102, 103, 104]

environment:
  mobility: trajectory replay of data/coldtrain/ (fragment mode)
  episode_length_frames: 20            # one whole fragment; tasks on frames 2-20
  episode_start: fragment drawn uniformly with replacement (generator seed = training seed + 999)
  state_space_version: 6               # 30 features, docs/observation-space.md
  task_profile_version: 5              # docs/experimental-configuration.md
  rsu_profile_version: 2               # passed by the script; not applied in replay mode (RSU = 8 x 2.0 GHz from config.py)
  lambda_per_veh_per_sec: 0.5
  category_mix: {safety: 0.30, autonomous: 0.35, infotainment: 0.35}
  v2v_range_m: 200                     # 0 for the local variant
  peer_selection: best                 # earliest estimated processing finish within 200 m
  rsu_selection: nearest               # no coverage limit in replay mode
  task_seed_base: 12345

reward:
  reward_type: deadline_only           # r = w_c * (+1 met / -1 missed), docs/rewards.md
  category_weight: {safety: 2.0, autonomous: 1.0, infotainment: 0.5}
  invalid_action_penalty: -3.0

dqn:                                   # Stable-Baselines3 2.3.2, MlpPolicy
  total_timesteps: 1500000             # one timestep = one task decision
  learning_rate: 1.0e-4
  buffer_size: 100000
  learning_starts: 1000
  batch_size: 32
  tau: 1.0
  gamma: 0.99
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 1000
  exploration_fraction: 0.1
  exploration_initial_eps: 1.0
  exploration_final_eps: 0.05
  net_arch: [256, 256]
  activation_fn: ReLU
  evaluated_checkpoint: final          # intermediate checkpoints (every 50,000 steps) are not used
